<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05030a">
  <title>EL NÚCLEO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='8' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%238b5cf6' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%2322d3ee' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    /* ========== Escena ========== */
    :root {
      --mood: #8b5cf6;
      --mood-2: #22d3ee;
      --bg-glow: rgba(88, 28, 135, 0.42);
      --dur: 2.8s;
      --scale: 0.78;
      --glow: 0.9;
      --ink: rgba(255, 255, 255, 0.92);
      --skin: #8b5cf6;
      --skin-2: #22d3ee;
      --mark: #ffd166;
      --press: 0;
      --charge: 0;
      --open: 0;
      --heat: 0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #05030a;
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      background:
        radial-gradient(ellipse at 50% 46%, var(--bg-glow), transparent 46%),
        radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--skin-2) 28%, transparent), transparent 38%),
        radial-gradient(ellipse at 50% 80%, rgba(8, 47, 73, 0.28), transparent 42%),
        #05030a;
      transition: background 0.8s ease;
    }

    body.invert {
      filter: invert(1) hue-rotate(180deg);
    }

    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
    }

    #waves {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      left: 50%;
      top: 46%;
      width: calc(min(38vmin, 250px) * var(--scale));
      height: calc(min(38vmin, 250px) * var(--scale));
      border-radius: 50%;
      border: 1.5px solid var(--mood-2);
      box-shadow: 0 0 18px var(--mood), inset 0 0 12px var(--mood-2);
      transform: translate(-50%, -50%) scale(0.35);
      opacity: 0.85;
      animation: ripple 0.95s ease-out forwards;
    }

    @keyframes ripple {
      to { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
    }

    /* ========== El Núcleo ========== */
    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 3;
      padding-bottom: 18vh;
    }

    .core {
      position: relative;
      width: calc(min(38vmin, 250px) * var(--scale));
      height: calc(min(38vmin, 250px) * var(--scale));
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      touch-action: none;
      -webkit-touch-callout: none;
      transform: scale(0);
      animation: born 1.5s cubic-bezier(0.16, 0.84, 0.28, 1) 0.15s forwards;
      transition: width 0.9s ease, height 0.9s ease;
      outline: none;
    }

    .core:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.35);
      outline-offset: 18px;
      border-radius: 50%;
    }

    @keyframes born {
      to { transform: scale(1); }
    }

    .pulse {
      position: absolute;
      inset: 0;
      animation: pulse var(--dur) ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.065); }
    }

    .core.holding .pulse {
      animation: none;
      transform: scale(calc(1 - var(--press) * 0.2)) rotate(calc(var(--press) * -6deg));
      filter: saturate(calc(1 + var(--press))) brightness(calc(1 + var(--press) * 0.35));
    }
    .core.release .pulse { animation: release 0.62s cubic-bezier(0.16, 0.84, 0.32, 1) forwards; }
    .core.blink .pulse { animation: blink 0.22s linear 4; }
    .core.flash .orb { filter: brightness(2.25) saturate(1.4) hue-rotate(18deg); }

    @keyframes release {
      0% { transform: scale(0.52); filter: brightness(1.8); }
      55% { transform: scale(1.16); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.12; }
    }

    .halo, .ring, .orb, .spark {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .halo-a {
      inset: -18%;
      background: radial-gradient(circle, var(--mood) 0%, transparent 68%);
      filter: blur(16px);
      opacity: var(--glow);
    }

    .halo-b {
      inset: -48%;
      background: radial-gradient(circle, var(--mood-2) 0%, transparent 70%);
      filter: blur(34px);
      opacity: calc(var(--glow) * 0.55);
    }

    .orb {
      inset: 16%;
      background:
        radial-gradient(circle at 50% 50%, #07040f 0 calc((22 - var(--open) * 14) * 1%), transparent calc((24 - var(--open) * 14) * 1%)),
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.98), transparent 16%),
        radial-gradient(circle at 50% 55%, #fff 0 8%, var(--skin-2) 28%, var(--skin) 58%, #120816 86%);
      box-shadow:
        0 0 10px rgba(255, 255, 255, 0.45),
        0 0 28px var(--skin),
        0 0 70px var(--skin),
        0 0 120px var(--skin-2),
        inset 0 0 22px rgba(255, 255, 255, 0.28);
      translate: var(--lean-x, 0px) var(--lean-y, 0px);
      transition: filter 0.18s ease, background 0.7s ease, translate 0.28s ease, inset 0.7s ease, border-radius 0.8s ease;
    }

    .spark {
      inset: 38%;
      background: radial-gradient(circle, #fff, rgba(255, 255, 255, 0.15) 70%, transparent 72%);
      filter: blur(0.4px);
      opacity: 0.9;
    }

    .beat-ring { display: none; }

    .eye { display: none; }

    body[data-level="2"] .orb {
      inset: 6%;
      background:
        radial-gradient(circle at var(--ix, 50%) var(--iy, 42%), #05030a 0 16%, transparent 17%),
        radial-gradient(circle at var(--ix, 50%) var(--iy, 42%), #f4fbff 0 38%, transparent 39%),
        radial-gradient(circle at 50% 56%, var(--skin-2), var(--skin) 48%, #07040f 78%);
      box-shadow:
        0 0 22px #fff,
        0 0 48px var(--skin-2),
        0 0 100px var(--skin),
        inset 0 0 24px rgba(255, 255, 255, 0.35);
    }

    body[data-level="3"] .orb {
      inset: 24%;
      background:
        radial-gradient(circle at 32% 30%, #fff, transparent 22%),
        radial-gradient(circle at 50% 50%, var(--skin-2), var(--skin) 70%, #07040f);
    }

    body[data-level="4"] .orb {
      inset: 20% 10%;
      background:
        radial-gradient(circle at 30% 28%, #fff 0 10%, transparent 22%),
        radial-gradient(ellipse at 50% 50%, var(--skin-2), var(--skin) 55%, #1a0c04 88%);
    }

    body[data-level="5"] .orb {
      inset: 12%;
      background:
        radial-gradient(circle at 50% 50%, #fff 0 14%, #ffe8a3 28%, var(--skin-2) 48%, var(--skin) 72%, #3b0a00);
      animation: corona-breathe 1.4s ease-in-out infinite;
    }

    body[data-level="6"] .orb {
      inset: 10%;
      background:
        radial-gradient(circle at 50% 50%, #fff 0 8%, transparent 18%),
        conic-gradient(from 40deg, #22d3ee, #a78bfa, #f472b6, #67e8f9, #22d3ee);
      animation: spin 18s linear infinite;
      box-shadow:
        0 0 24px #fff,
        0 0 60px #22d3ee,
        0 0 110px #a78bfa;
    }

    @keyframes corona-breathe {
      50% { filter: brightness(1.25) saturate(1.2); }
    }

    .lobe, .saturn, .rays, .spiral { display: none; position: absolute; pointer-events: none; }

    .lobe {
      width: 46%;
      height: 46%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, var(--skin-2) 40%, var(--skin) 72%);
      box-shadow: 0 0 18px var(--skin), 0 0 36px var(--skin-2);
      animation: lobe-breathe 2.6s ease-in-out infinite;
    }

    .l1 { background: radial-gradient(circle at 35% 35%, #fff, #67e8f9 42%, #0891b2 78%); }
    .l2 { background: radial-gradient(circle at 35% 35%, #fff, #f472b6 42%, #9d174d 78%); }
    .l3 { background: radial-gradient(circle at 35% 35%, #fff, #fbbf24 42%, #b45309 78%); }

    .l2 { animation-delay: -0.8s; }
    .l3 { animation-delay: -1.6s; }

    @keyframes lobe-breathe {
      50% { transform: scale(1.14); }
    }

    body[data-level="3"] .lobe { display: block; }

    .l1 { left: 4%; top: 28%; }
    .l2 { right: 4%; top: 28%; }
    .l3 { left: 29%; bottom: 6%; }

    .saturn {
      left: 50%;
      top: 50%;
      width: 168%;
      height: 42%;
      border: 7px solid rgba(255, 255, 255, 0.82);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotateX(72deg) rotate(var(--twist, 0deg));
      box-shadow: 0 0 16px var(--mood-2), inset 0 0 12px var(--mood);
    }

    body[data-level="4"] .saturn { display: block; }

    .pulse { perspective: 520px; }

    .rays, .spiral {
      inset: -28%;
      border-radius: 50%;
    }

    .rays {
      background: repeating-conic-gradient(from 0deg, transparent 0 14deg, rgba(255, 255, 255, 0.72) 14deg 16deg);
      -webkit-mask: radial-gradient(circle, transparent 36%, #000 48%, transparent 70%);
      mask: radial-gradient(circle, transparent 36%, #000 48%, transparent 70%);
      animation: spin 14s linear infinite;
    }

    body[data-level="5"] .rays { display: block; }

    .spiral {
      background: conic-gradient(from 20deg, transparent 0 40%, rgba(34, 211, 238, 0.85), transparent 68%, rgba(139, 92, 246, 0.9), transparent 100%);
      -webkit-mask: radial-gradient(circle, transparent 18%, #000 30%, transparent 62%);
      mask: radial-gradient(circle, transparent 18%, #000 30%, transparent 62%);
      animation: spin 9s linear infinite reverse;
      mix-blend-mode: screen;
    }

    body[data-level="6"] .spiral { display: block; }

    .spin-cue {
      position: absolute;
      inset: -24%;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      pointer-events: none;
      opacity: 0;
    }

    body[data-mission="spin"] .spin-cue {
      opacity: 1;
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 18px var(--skin-2);
      animation: spin 2.8s linear infinite;
    }

    .charge {
      position: absolute;
      inset: -14%;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      background: conic-gradient(from -90deg, var(--skin-2) calc(var(--charge) * 1turn), rgba(255, 255, 255, 0.08) 0);
      -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%, #000 70%, transparent 72%);
      mask: radial-gradient(circle, transparent 58%, #000 60%, #000 70%, transparent 72%);
      transition: opacity 0.2s ease;
    }

    .core.holding .charge,
    body[data-mission="hold"] .charge { opacity: 1; }

    #cracks {
      position: absolute;
      inset: 10%;
      opacity: var(--crack, 0);
      pointer-events: none;
      z-index: 7;
      transition: opacity 0.3s linear;
    }

    #cracks path {
      fill: none;
      stroke: #fff;
      stroke-width: 1.4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px #fff);
    }

    .core.gulp .pulse { animation: gulp 0.42s cubic-bezier(0.2, 1.4, 0.3, 1); }

    @keyframes gulp {
      0% { transform: scale(0.82); }
      42% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    #motes {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .mote {
      position: absolute;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      pointer-events: auto;
      cursor: pointer;
      background: radial-gradient(circle at 35% 32%, #fff, var(--mood-2) 46%, transparent 74%);
      box-shadow: 0 0 14px var(--mood-2), 0 0 26px var(--mood);
      touch-action: manipulation;
    }

    .mote.near {
      width: 48px;
      height: 48px;
      margin: -24px 0 0 -24px;
      background: radial-gradient(circle at 35% 32%, #fff 0 28%, var(--mood-2) 52%, transparent 76%);
      box-shadow: 0 0 18px #fff, 0 0 36px var(--mood-2), 0 0 60px var(--mood);
      animation: mote-call 0.7s ease-in-out infinite;
    }

    @keyframes mote-call {
      50% { transform: scale(1.18); }
    }

    .mote.wild {
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      background: radial-gradient(circle at 35% 32%, #fff, #ffb703 40%, #ff5400 72%, transparent 78%);
      box-shadow: 0 0 18px #ffb703, 0 0 32px #ff5400;
      animation: mote-flee 0.32s ease-in-out infinite;
    }

    @keyframes mote-flee {
      50% { transform: scale(1.22) translate(2px, -2px); }
    }

    .mote.tint {
      background: radial-gradient(circle at 35% 32%, #fff, var(--mark) 48%, transparent 74%);
      box-shadow: 0 0 16px var(--mark), 0 0 32px var(--mark);
    }

    .mote.twin {
      box-shadow: 0 0 0 2px #fff, 0 0 18px var(--mark), 0 0 28px var(--skin-2);
    }

    #stars {
      position: absolute;
      inset: -38%;
      pointer-events: none;
    }

    #stars i {
      position: absolute;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px #fff, 0 0 14px var(--mood-2);
    }

    .ring {
      border: 1px solid transparent;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .r1 { inset: 4%; border-color: rgba(255, 255, 255, 0.38); }
    .r2 { inset: -8%; border-color: var(--mood-2); box-shadow: 0 0 16px var(--mood-2); }
    .r3 { inset: -14%; border-style: dashed; border-color: var(--mood); }

    body[data-level="2"] .r1,
    body[data-level="3"] .r1,
    body[data-level="4"] .r1,
    body[data-level="5"] .r1,
    body[data-level="6"] .r1 { opacity: 0.75; }

    body[data-level="3"] .r2,
    body[data-level="4"] .r2,
    body[data-level="5"] .r2,
    body[data-level="6"] .r2 { opacity: 0.9; }

    body[data-level="4"] .r2,
    body[data-level="5"] .r2,
    body[data-level="6"] .r2 { animation: spin 16s linear infinite; }

    body[data-level="5"] .r3,
    body[data-level="6"] .r3 { opacity: 0.8; }

    body[data-level="6"] .r3 { animation: spin 26s linear infinite reverse; }
    body[data-level="6"] .spark { inset: 34%; opacity: 1; }

    body.asleep { --glow: 0.28; }
    body.asleep .orb { filter: brightness(0.42) saturate(0.65); }
    body.asleep .ring,
    body.asleep .beat-ring { animation-play-state: paused; opacity: 0.25; }
    body.asleep .halo-b { opacity: 0.12; }

    /* El anillo se cierra sobre el núcleo: el latido justo es cuando lo toca. */
    .beat-ring {
      position: absolute;
      inset: -6%;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 16px var(--mood-2);
      opacity: 0.28;
      pointer-events: none;
      animation: beat var(--dur) ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1.42); opacity: 0.12; }
      50% { transform: scale(0.9); opacity: 0.9; }
    }

    #orbit {
      position: absolute;
      inset: -22%;
      pointer-events: none;
    }

    .moon-spin {
      position: absolute;
      inset: 0;
      animation: spin linear infinite;
    }

    .moon-spin i {
      position: absolute;
      top: 0;
      left: 50%;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px var(--mood-2), 0 0 18px var(--mood);
    }

    #combo {
      position: absolute;
      top: -1.8rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: Inter, system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      color: #fff;
      text-shadow: 0 0 12px var(--mood-2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #combo.on { opacity: 0.92; }

    .floater {
      position: absolute;
      left: 50%;
      top: 40%;
      transform: translate(-50%, 0);
      font-family: Inter, system-ui, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      color: #fff;
      text-shadow: 0 0 12px var(--mood-2);
      animation: float-up 0.9s ease-out forwards;
      pointer-events: none;
    }

    @keyframes float-up {
      to { transform: translate(-50%, -72px); opacity: 0; }
    }

    body.ascend #stage,
    body.feast #stage { animation: tremor 0.45s linear 2; }
    body.ascend .orb { animation: birth 0.95s cubic-bezier(0.16, 0.84, 0.28, 1); }

    @keyframes birth {
      0% { transform: scale(0.35) rotate(-24deg); filter: brightness(3) saturate(0.4); }
      48% { transform: scale(1.28) rotate(8deg); filter: brightness(1.8); }
      100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
    }
    body.surge .beat-ring { opacity: 1; border-color: #fff; }
    body.surge .orb { filter: brightness(1.35) saturate(1.2); }
    body.imminent .orb { animation: tremble 0.16s linear infinite; }
    body.imminent #fill { box-shadow: 0 0 14px #fff, 0 0 22px var(--mood); }
    body.imminent .beat-ring { opacity: 0.8; }

    @keyframes tremor {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-7px, 3px); }
      40% { transform: translate(6px, -4px); }
      60% { transform: translate(-4px, 5px); }
      80% { transform: translate(5px, 2px); }
    }

    @keyframes tremble {
      50% { transform: translate(1px, -1px); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #sigil {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(1.4rem, 4vmin, 2.2rem);
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 0 18px #fff, 0 0 32px var(--mood-2);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    #sigil.on { animation: sigil 1.7s ease forwards; }

    @keyframes sigil {
      0% { opacity: 0; transform: scale(0.4); }
      18% { opacity: 1; transform: scale(1); }
      72% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.45); }
    }

    /* ========== Textos ========== */
    .ghost {
      position: fixed;
      z-index: 4;
      margin: 0;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 0 12px var(--mood-2), 0 0 24px rgba(139, 92, 246, 0.45);
    }

    #mark {
      top: max(1.2rem, env(safe-area-inset-top));
      left: 0;
      right: 0;
      font-size: 0.72rem;
      letter-spacing: 0.48em;
      font-weight: 500;
      opacity: 0.42;
      padding-left: 0.48em;
    }

    #hint {
      left: 50%;
      top: calc(50% + min(24vmin, 150px));
      transform: translateX(-50%);
      width: min(90vw, 28rem);
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      letter-spacing: 0.08em;
      opacity: 0;
    }

    #mark { z-index: 8; }
    #hint, #quest, #msg, #hud, #relics, #meter { z-index: 8; }
    #hint.show { animation: fade-in 2.2s ease 0.7s forwards; }
    #hint.hide { animation: fade-out 0.8s ease forwards; }

    @keyframes fade-in { to { opacity: 0.88; } }
    @keyframes fade-out { to { opacity: 0; } }

    #quest {
      left: 50%;
      bottom: max(4.55rem, calc(env(safe-area-inset-bottom) + 4.05rem));
      transform: translateX(-50%);
      width: min(92vw, 32rem);
      font-size: clamp(0.78rem, 2.1vw, 0.95rem);
      letter-spacing: 0.08em;
      opacity: 0.82;
      z-index: 6;
    }

    #msg {
      left: 50%;
      bottom: max(6.35rem, calc(env(safe-area-inset-bottom) + 5.7rem));
      transform: translateX(-50%);
      width: min(92vw, 40rem);
      min-height: 3.2em;
      font-size: clamp(0.98rem, 2.5vw, 1.28rem);
      line-height: 1.45;
      font-weight: 400;
      z-index: 6;
      text-shadow:
        0 0 12px #05030a,
        0 0 18px var(--mood-2),
        0 2px 14px #000;
    }

    #msg::after {
      content: "";
      display: inline-block;
      width: 0.45ch;
      height: 0.9em;
      margin-left: 2px;
      background: var(--mood-2);
      box-shadow: 0 0 8px var(--mood-2);
      vertical-align: -0.08em;
      opacity: 0;
    }

    #msg.typing::after { opacity: 0.8; animation: caret 0.8s steps(1) infinite; }

    @keyframes caret {
      50% { opacity: 0; }
    }

    #relics {
      bottom: max(2.45rem, calc(env(safe-area-inset-bottom) + 2.05rem));
      left: 0;
      right: 0;
      font-size: 0.78rem;
      letter-spacing: 0.42em;
      opacity: 0.7;
    }

    #relics span { opacity: 0.22; }
    #relics span.on {

    /* ========== Almacenamiento ========== */
    function todayKey(date) {
      var d = date || new Date();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }

    function loadState() {
      var today = todayKey();
      var fresh = {
        clicks: 0,
        level: 1,
        lastWhisper: "",
        lastWhisperDate: "",
        firstVisit: today,
        lastVisit: today,
        streak: 1,
        bestCombo: 0,
        questIndex: 0
      };
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fresh;
        var data = JSON.parse(raw);
        fresh.clicks = Math.max(0, Math.floor(Number(data.clicks) || 0));
        fresh.lastWhisper = typeof data.lastWhisper === "string" ? data.lastWhisper : "";
        fresh.lastWhisperDate = typeof data.lastWhisperDate === "string" ? data.lastWhisperDate : "";
        fresh.firstVisit = data.firstVisit || today;
        fresh.lastVisit = data.lastVisit || "";
        fresh.streak = Math.max(1, Math.floor(Number(data.streak) || 1));
        fresh.bestCombo = Math.max(0, Math.floor(Number(data.bestCombo) || 0));
        fresh.questIndex = Math.max(0, Math.floor(Number(data.questIndex) || 0));
      } catch (err) {
        return fresh;
      }
      fresh.level = levelFromClicks(fresh.clicks);
      applyStreak(fresh);
      return fresh;
    }

    function applyStreak(data) {
      var today = todayKey();
      if (!data.firstVisit) data.firstVisit = today;
      if (!data.lastVisit) {
        data.lastVisit = today;
        data.streak = 1;
        return;
      }
      if (data.lastVisit === today) return;
      var y = new Date();
      y.setDate(y.getDate() - 1);
      data.streak = data.lastVisit === todayKey(y) ? data.streak + 1 : 1;
      data.lastVisit = today;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) { /* modo privado: la visita sigue, sin memoria */ }
    }

    function levelFromClicks(n) {
      var level = 1;
      for (var i = 0; i < THRESHOLDS.length; i++) {
        if (n >= THRESHOLDS[i]) level = i + 2;
      }
      return level;
    }

    function energyRatio(n) {
      var level = levelFromClicks(n);
      if (level >= 6) return 1;
      var prev = level === 1 ? 0 : THRESHOLDS[level - 2];
      var next = THRESHOLDS[level - 1];
      return (n - prev) / (next - prev);
    }

    /* ========== Ánimo ========== */
    function moodFromHour(date) {
      var h = (date || new Date()).getHours();
      if (h < 6) return "dawn";
      if (h < 12) return "morning";
      if (h < 18) return "afternoon";
      return "night";
    }

    function applyMood(name) {
      moodName = name;
      var palette = MOODS[name];

      root.setProperty("--mood-2", palette.mood2);
      root.setProperty("--bg-glow", palette.bg);
      document.body.dataset.mood = name;
      particleColor = palette.mood2;
      applyPulse();
    }

    function applyLevel() {
      var ratio = energyRatio(state.clicks);
      document.body.dataset.level = String(state.level);
      document.documentElement.style.setProperty("--scale", String(LEVEL_SCALE[state.level] || 1));
      hud.textContent = "Día " + state.streak + " · Nivel " + state.level;
      fill.style.width = Math.round(ratio * 100) + "%";
      document.body.classList.toggle("imminent", state.level < 6 && ratio >= 0.82);
      var crack = state.level >= 6 ? 0 : Math.max(0, (ratio - 0.28) / 0.72);
      var skin = LEVEL_SKIN[state.level] || {};
      var root = document.documentElement.style;
      root.setProperty("--crack", crack.toFixed(2));
      root.setProperty("--open", ratio.toFixed(3));
      root.setProperty("--heat", ratio.toFixed(3));
      root.setProperty("--skin", skin.a || MOODS[moodName].mood);
      root.setProperty("--skin-2", skin.b || MOODS[moodName].mood2);
      if (state.level >= 2) particleColor = skin.b || particleColor;
      renderRelics();
      renderQuest();
      syncOrbit();
      applyPulse();
    }

    function renderRelics() {
      var html = "";
      var i;
      for (i = 0; i < GLYPHS.length; i++) {
        var on = state.level > i + 1;
        html += '<span class="' + (on ? "on" : "") + '">' + (on ? GLYPHS[i] : "·") + "</span>";
      }
      relics.innerHTML = html;
    }

    function syncOrbit() {
      var count = Math.max(0, state.level - 1);
      var speeds = [7.5, 11, 15, 9, 18];
      orbit.innerHTML = "";
      for (var i = 0; i < count; i++) {
        var spin = document.createElement("div");
        spin.className = "moon-spin";
        spin.style.animationDuration = speeds[i] + "s";
        if (i % 2) spin.style.animationDirection = "reverse";
        spin.style.inset = (i * 6) + "%";
        var dot = document.createElement("i");
        spin.appendChild(dot);
        orbit.appendChild(spin);
      }
    }

    function applyPulse() {
      var base = MOODS[moodName].dur;
      var levelRate = LEVEL_TIME[state.level] || 1;
      var sleepRate = document.body.classList.contains("asleep") ? 2.45 : 1;
      document.documentElement.style.setProperty("--dur", (base * levelRate * sleepRate).toFixed(2) + "s");
      pulseAnchor = performance.now();
    }

    /* ========== Audio ========== */
    function audio() {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, dur, type, gain, slide) {
      var ac = audio();
      if (!ac) return;
      var t = ac.currentTime;
      var osc = ac.createOscillator();
      var g = ac.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      g.connect(ac.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function noise(dur, gainValue) {
      var ac = audio();
      if (!ac) return;
      var n = Math.floor(ac.sampleRate * dur);
      var buffer = ac.createBuffer(1, n, ac.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = ac.createBufferSource();
      var filter = ac.createBiquadFilter();
      var g = ac.createGain();
      src.buffer = buffer;
      filter.type = "lowpass";
      filter.frequency.value = 880;
      g.gain.value = gainValue;
      src.connect(filter);
      filter.connect(g);
      g.connect(ac.destination);
      src.start();
    }

    /* ========== Partículas ========== */
    var ambient = [];
    var bursts = [];
    var mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    var dpr = 1;
    var viewW = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 1.75);
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      canvas.style.width = viewW + "px";
      canvas.style.height = viewH + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    function makeAmbient() {
      return {
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.7 + 0.4,
        a: Math.random() * 0.45 + 0.15
      };
    }

    function seedAmbient() {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var target = reduce ? 36 : AMBIENT_TARGET;
      while (ambient.length < target && ambient.length + bursts.length < MAX_PARTICLES) {
        ambient.push(makeAmbient());
      }
    }

    function totalParticles() {
      return ambient.length + bursts.length;
    }

    function pushBurst(x, y, vx, vy, life, r) {
      if (totalParticles() >= MAX_PARTICLES) {
        if (!bursts.length) return;
        bursts.shift();
      }
      bursts.push({ x: x, y: y, vx: vx, vy: vy, life: life, r: r });
    }

    function center() {
      var rect = core.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2

    }

    function shootOne() {
      var c = center();
      var angle = Math.random() * Math.PI * 2;
      var speed = 5.5 + Math.random() * 4;
      pushBurst(c.x, c.y, Math.cos(angle) * speed, Math.sin(angle) * speed, 1, 2.6);
    }

    function explode() {
      var c = center();
      var room = MAX_PARTICLES - totalParticles();
      var count = Math.min(56, Math.max(room, 12));
      for (var i = 0; i < count; i++) {
        var angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
        var speed = 1.8 + Math.random() * 7.2;
        pushBurst(
          c.x + Math.cos(angle) * 8,
          c.y + Math.sin(angle) * 8,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          0.75 + Math.random() * 0.35,
          1.2 + Math.random() * 2.2
        );
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, viewW, viewH);
      ctx.globalCompositeOperation = "lighter";
      var i, p, dx, dy, dist;
      for (i = 0; i < ambient.length; i++) {
        p = ambient[i];
        dx = mouse.x - p.x;
        dy = mouse.y - p.y;
        dist = Math.hypot(dx, dy) || 1;
        var pull = Math.min(42 / dist, 0.22);
        p.vx += (dx / dist) * pull * 0.08;
        p.vy += (dy / dist) * pull * 0.08;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -8) p.x = viewW + 8;
        if (p.x > viewW + 8) p.x = -8;
        if (p.y < -8) p.y = viewH + 8;
        if (p.y > viewH + 8) p.y = -8;
        ctx.beginPath();
        ctx.fillStyle = particleColor;
        ctx.globalAlpha = p.a;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      for (i = bursts.length - 1; i >= 0; i--) {
        p = bursts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= 0.016;
        if (p.life <= 0) {
          bursts.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.fillStyle = "#ffffff";
        ctx.globalAlpha = Math.max(p.life, 0) * 0.9;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.strokeStyle = "rgba(255,255,255,0.16)";
      ctx.lineWidth = 1;
      ctx.arc(hub.x, hub.y, orbitR, 0, Math.PI * 2);
      ctx.stroke();
      if (targetMote && targetMote.x != null && targetMote.hide <= performance.now()) {
        ctx.strokeStyle = "rgba(255,255,255,0.75)";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 7]);
        ctx.beginPath();
        ctx.moveTo(hub.x, hub.y);
        ctx.lineTo(targetMote.x, targetMote.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    function frame(now) {
      if (!now) now = performance.now();
      var dt = lastFrame ? Math.min(48, now - lastFrame) : 16;
      lastFrame = now;
      if (!document.hidden && !document.body.classList.contains("asleep")) {
        presence += dt;
        if (presence - lastGift >= 28000) {
          lastGift = presence;
          absorbMote();
        }
      }
      if (chainCount && now - lastEat > 2200) {
        chainCount = 0;
        if (missionNow().type === "chain") missionProg = 0;
        renderCombo();
      }
      tickPress(now, dt);
      placeMotes(dt);
      look();
      drawParticles();
      requestAnimationFrame(frame);
    }

    /* ========== Textos ========== */
    function say(text) {
      if (!text) return;
      if (typeQueue.length > 5) typeQueue.shift();
      typeQueue.push(text);
      if (!typing) nextLine();
    }

    function nextLine() {
      if (!typeQueue.length) {
        typing = false;
        msg.classList.remove("typing");
        return;
      }
      typing = true;
      var text = typeQueue.shift();
      var i = 0;
      msg.classList.add("typing");
      msg.textContent = "";
      clearTimeout(typeTimer);
      (function step() {
        i += 1;
        msg.textContent = text.slice(0, i);
        if (i < text.length) {
          typeTimer = setTimeout(step, text.length > 80 ? 16 : 28);
        } else {
          msg.classList.remove("typing");
          if (typeQueue.length) {
            typeTimer = setTimeout(nextLine, 700);
          } else {
            typing = false;
          }
        }
      })();
    }

    function pickWhisper() {
      var line = WHISPERS[Math.floor(Math.random() * WHISPERS.length)];
      if (WHISPERS.length > 1 && line === state.lastWhisper) {
        line = WHISPERS[(WHISPERS.indexOf(line) + 1) % WHISPERS.length];
      }
      return line;
    }

    /* ========== Evolución e interacción ========== */
    function spawnWave() {
      if (waves.childElementCount > 8) waves.firstElementChild.remove();
      var wave = document.createElement("span");
      wave.className = "wave";
      waves.appendChild(wave);
      wave.addEventListener("animationend", function () { wave.remove(); });
    }

    function flash() {
      core.classList.add("flash");
      setTimeout(function () { core.classList.remove("flash"); }, 180);
    }

    /* ========== Resonancia y recompensas ========== */
    function pulseDurMs() {
      var dur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dur")) * 1000;
      return dur > 200 ? dur : 2800;
    }

    function pulsePhase() {
      return ((performance.now() - pulseAnchor) % pulseDurMs()) / pulseDurMs();
    }

    function comboWindow() {
      return Math.max(2800, pulseDurMs() * 1.2);
    }

    function renderCombo() {
      if (!comboEl) return;
      if (chainCount >= 2 && performance.now() - lastEat < 2200) {
        comboEl.textContent = "Cadena ×" + chainCount;
        comboEl.classList.add("on");
      } else {
        comboEl.textContent = "";
        comboEl.classList.remove("on");
      }
      renderQuest();
      renderStars();
    }

    function renderQuest() {
      if (!questEl) return;
      var m = missionNow();
      document.body.dataset.mission = m.type;
      var shown = m.type === "spin"
        ? Math.min(100, Math.round(missionProg / m.need * 100)) + "%"
        : Math.min(missionProg, m.need) + "/" + m.need;
      questEl.textContent = m.label + " · " + shown;
      if (lastDressed !== m.type) {
        lastDressed = m.type;
        dressMotes();
      }
    }

    function renderStars() {
      if (!starsEl) return;
      var n = Math.min(chainCount, 8);
      var html = "";
      var i;
      for (i = 0; i < n; i++) {
        var ang = (Math.PI * 2 * i) / n - Math.PI / 2;
        var x = 50 + Math.cos(ang) * 42;
        var y = 50 + Math.sin(ang) * 42;
        html += '<i style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%"></i>';
      }
      starsEl.innerHTML = html;
    }

    function look() {
      var c = center();
      var dx = mouse.x - c.x;
      var dy = mouse.y - c.y;
      var dist = Math.hypot(dx, dy) || 1;
      var pull = Math.min(10, dist / 22);
      var x = 50 + (dx / dist) * pull;
      var y = 46 + (dy / dist) * pull;
      document.documentElement.style.setProperty("--ix", x.toFixed(1) + "%");
      document.documentElement.style.setProperty("--iy", y.toFixed(1) + "%");
    }

    function floatText(text) {
      var el = document.createElement("span");
      el.className = "floater";
      el.textContent = text;
      waves.appendChild(el);
      el.addEventListener("animationend", function () { el.remove(); });
    }

    function absorbMote() {
      var c = center();
      var i;
      for (i = 0; i < 8; i++) {
        var angle = (Math.PI * 2 * i) / 8;
        var dist = 160 + (i % 3) * 24;
        pushBurst(
          c.x + Math.cos(angle) * dist,
          c.y + Math.sin(angle) * dist,
          -Math.cos(angle) * 2.4,
          -Math.sin(angle) * 2.4,
          1,
          1.7
        );
      }
      tone(640, 0.18, "sine", 0.03, 1.25);
      moteCount += 1;
      floatText("aliento");
      if (moteCount >= 4) {
        moteCount = 0;
        blessings = 8;
        document.body.classList.add("surge");
        clearTimeout(surgeTimer);
        surgeTimer = setTimeout(function () { document.body.classList.remove("surge"); }, 8000);
        say("Hambre: las próximas 8 luces valen doble.");
        playChord();
      }
    }

    function celebrate(level) {
      document.body.classList.remove("ascend");
      void document.body.offsetWidth;
      document.body.classList.add("ascend");
      spawnWave();
      spawnWave();
      explode();
      playChord();
      setTimeout(function () { document.body.classList.remove("ascend"); }, 1100);
      say(REWARD[level]);
    }

    var surgeTimer = 0;

    /* Las luces orbitan. La más cercana brilla: tocarla o tocar el núcleo la traga. */
    function missionNow() {
      return MISSIONS[missionIndex % MISSIONS.length];
    }

    function checkMission() {
      var label = missionNow().label;
      missionIndex += 1;
      state.questIndex = missionIndex;
      missionProg = 0;
      chainCount = 0;
      lastDressed = "";
      saveState();
      document.body.classList.add("feast");
      clearTimeout(feastTimer);
      feastTimer = setTimeout(function () { document.body.classList.remove("feast"); }, 700);
      say("Listo: " + label + ".");
      explode();
      playChord();
      renderCombo();
    }

    function addMission(n) {
      missionProg += n;
      if (missionProg >= missionNow().need) {
        checkMission();
        return;
      }
      var type = missionNow().type;
      if (type === "chase") markWild();
      if (type === "tint") markTint();
      renderCombo();
    }

    function feedChain() {
      var now = performance.now();
      if (now - lastEat < 2200) chainCount += 1;
      else chainCount = 1;
      lastEat = now;
      rush = Math.min(3.4, rush + 0.45);
    }

    function scoreMission() {
      var m = missionNow();
      if (m.type === "eat" || m.type === "chain") {
        if (m.type === "eat") missionProg += 1;
        if (m.type === "chain") missionProg = chainCount;
        if (missionProg >= m.need) checkMission();
        else renderCombo();
        lastFed = null;
        return;
      }
      if (lastFed) {
        if (m.type === "chase" && lastFed.kind === "wild") addMission(1);
        else if (m.type === "tint" && lastFed.kind === "tint") addMission(1);
        else if (m.type === "pair" && lastFed.kind === "twin" && !lastFed.taken) {
          lastFed.taken = true;
          lastFed.el.classList.remove("twin");
          addMission(1);
        } else {
          renderCombo();
        }
      } else {
        renderCombo();
      }
      lastFed = null;
    }

    function addSpin(deg) {
      if (deg <= 0 || missionNow().type !== "spin") return;
      missionProg += deg;
      if (missionProg >= missionNow().need) checkMission();
      else renderQuest();
    }

    function liveMotes() {
      var now = performance.now();
      var list = [];
      var i;
      for (i = 0; i < motes.length; i++) {
        if (motes[i].hide <= now) list.push(motes[i]);
      }
      return list.length ? list : motes.slice();
    }

    function pickMote(except) {
      var list = liveMotes();
      var pool = [];
      var i;
      for (i = 0; i < list.length; i++) {
        if (list[i] !== except) pool.push(list[i]);
      }
      if (!pool.length) pool = list;
      return pool[Math.floor(Math.random() * pool.length)] || null;
    }

    function clearKinds() {
      var i;
      for (i = 0; i < motes.length; i++) {
        motes[i].kind = "";
        motes[i].taken = false;
        motes[i].el.classList.remove("wild", "tint", "twin");
      }
    }

    function markWild() {
      clearKinds();
      var m = pickMote();
      if (!m) return;
      m.kind = "wild";
      m.el.classList.add("wild");
    }

    function markTint() {
      clearKinds();
      var color = TINTS[Math.floor(Math.random() * TINTS.length)];
      document.documentElement.style.setProperty("--mark", color);
      var m = pickMote();
      if (!m) return;
      m.kind = "tint";
      m.el.classList.add("tint");
    }

    function markPair() {
      clearKinds();
      var a = pickMote();
      var b = pickMote(a);
      if (!a) return;
      a.kind = "twin";
      a.el.classList.add("twin");
      if (b && b !== a) {
        b.kind = "twin";
        b.el.classList.add("twin");
      }
      document.documentElement.style.setProperty("--mark", "#fff4d6");
    }

    function dressMotes() {
      ensureMotes();
      var type = missionNow().type;
      if (type === "chase") markWild();
      else if (type === "tint") markTint();
      else if (type === "pair") markPair();
      else clearKinds();
    }

    function tickPress(now, dt) {
      var root = document.documentElement.style;
      if (core.classList.contains("holding") && drag) {
        var held = now - drag.t;
        var p = Math.min(1.15, held / 1400);
        root.setProperty("--press", p.toFixed(3));
        root.setProperty("--charge", Math.min(1, held / 1400).toFixed(3));
        if (missionNow().type === "hold" && held >= 1400 && drag.moved < 18 && !drag.charged) {
          drag.charged = true;
          floatText("Carga");
          tone(420, 0.2, "sine", 0.03, 1.1);
          addMission(1);
        }
      } else {
        var cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--press")) || 0;
        root.setProperty("--press", Math.max(0, cur - dt / 160).toFixed(3));
        root.setProperty("--charge", "0");
      }
    }

    function bindMote(mote) {
      mote.el.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        audio();
        noteActivity();
        swallow(mote);
        registerClick();
      });
    }

    function orbitLimit() {
      var c = center();
      var hintTop = hint ? hint.getBoundingClientRect().top : window.innerHeight * 0.7;
      var down = hintTop - c.y - 42;
      var up = c.y - 72;
      var room = Math.min(down / 0.8, up, window.innerWidth * 0.32);
      return Math.max(88, room);
    }

    function ensureMotes() {
      if (!moteLayer) return;
      var want = 4;
      while (motes.length < want) {
        var el = document.createElement("button");
        el.type = "button";
        el.className = "mote";
        el.setAttribute("aria-label", "Luz");
        var mote = {
          el: el,
          ang: Math.random() * Math.PI * 2,
          radius: [0.86, 0.86, 1, 1][motes.length],
          speed: (0.00115 + motes.length * 0.00022) * (motes.length % 2 ? -1 : 1),
          hide: 0,
          x: 0,
          y: 0,
          kind: "",
          taken: false
        };
        moteLayer.appendChild(el);
        motes.push(mote);
        bindMote(mote);
      }
    }

    function placeMotes(dt) {
      ensureMotes();
      rush += (1 - rush) * Math.min(1, dt / 900);
      var c = center();
      var limit = orbitLimit();
      orbitR = limit * 0.86;
      var nearest = null;
      var best = Infinity;
      var i;
      for (i = 0; i < motes.length; i++) {
        var m = motes[i];
        m.ang += m.speed * dt * rush * (m.kind === "wild" ? 3.2 : 1);
        if (m.hide > performance.now()) {
          m.el.style.opacity = "0";
          m.el.style.pointerEvents = "none";
          m.el.classList.remove("near");
          continue;
        }
        m.el.style.opacity = "1";
        m.el.style.pointerEvents = "auto";
        if (m.kind !== "wild") m.el.style.transform = "";
        var rad = limit * m.radius;
        m.x = c.x + Math.cos(m.ang) * rad;
        m.y = c.y + Math.sin(m.ang) * rad * 0.8;
        m.el.style.left = m.x + "px";
        m.el.style.top = m.y + "px";
        var d = Math.hypot(m.x - c.x, m.y - c.y);
        if (d < best) {
          best = d;
          nearest = m;
        }
        m.el.classList.remove("near");
      }
      var want = missionNow().type;
      var marked = null;
      for (i = 0; i < motes.length; i++) {
        if (motes[i].hide > performance.now()) continue;
        if ((want === "chase" && motes[i].kind === "wild") ||
            (want === "tint" && motes[i].kind === "tint") ||
            (want === "pair" && motes[i].kind === "twin" && !motes[i].taken)) {
          marked = motes[i];
          break;
        }
      }
      targetMote = marked || nearest;
      if (targetMote) {
        targetMote.el.classList.add("near");
        var dx = targetMote.x - c.x;
        var dy = targetMote.y - c.y;
        var dist = Math.hypot(dx, dy) || 1;
        document.documentElement.style.setProperty("--lean-x", (dx / dist * 14).toFixed(1) + "px");
        document.documentElement.style.setProperty("--lean-y", (dy / dist * 10).toFixed(1) + "px");
      }
    }

    function swallow(m) {
      if (!m || m.hide > performance.now()) return false;
      lastFed = m;
      var c = center();
      m.hide = performance.now() + 820;
      m.el.style.pointerEvents = "none";
      m.el.style.transition = "left 0.16s ease, top 0.16s ease, opacity 0.16s ease, transform 0.16s ease";
      m.el.style.left = c.x + "px";
      m.el.style.top = c.y + "px";
      m.el.style.transform = "scale(0.15)";
      m.el.style.opacity = "0.2";
      m.ang = Math.random() * Math.PI * 2;
      setTimeout(function () {
        m.el.style.transition = "";
        m.el.style.transform = "";
      }, 180);
      return true;
    }

    function registerClick() {
      noteActivity();
      var today = todayKey();
      var hadWhisper = state.lastWhisperDate === today;
      var prevLevel = state.level;
      var gain = 1;
      if (blessings > 0) {
        blessings -= 1;
        gain = 2;
      }
      floatText(gain > 1 ? "+2" : "Luz");
      core.classList.remove("gulp");
      void core.offsetWidth;
      core.classList.add("gulp");
      feedChain();
      scoreMission();
      state.clicks += gain;
      state.level = levelFromClicks(state.clicks);
      var evolved = state.level > prevLevel;
      if (evolved) warnedImminent = false;
      saveState();
      applyLevel();
      spawnWave();
      flash();
      shootOne();
      playClick();
      if (hint.classList.contains("show")) {
        hint.classList.remove("show");
        hint.classList.add("hide");
      }
      if (state.level < 6 && energyRatio(state.clicks) >= 0.82 && !warnedImminent && !evolved) {
        warnedImminent = true;
        say("Casi subes de nivel. No pares.");
      }
      if (evolved) {
        celebrate(state.level);
      } else if (hadWhisper && state.clicks > 0 && state.clicks % 50 === 0) {
        say(SESSION_LINES[Math.floor(state.clicks / 50) % SESSION_LINES.length]);
      }
      if (!hadWhisper) {
        var line = pickWhisper();
        state.lastWhisper = line;
        state.lastWhisperDate = today;
        saveState();
        tone(196, 0.7, "sine", 0.035, 0.8);
        say(line);
      } else if (whisperAlreadyToday && hadWhisper && !returnNoticeShown && !evolved) {
        returnNoticeShown = true;
        say("El Núcleo ya te habló hoy. Vuelve mañana...");
      }
    }

    /* ========== Secretos ========== */
    function secretDouble() {
      noteActivity();
      var glyph = SIGILS[Math.floor(Math.random() * SIGILS.length)];
      sigil.textContent = glyph;
      sigil.classList.remove("on");
      void sigil.offsetWidth;
      sigil.classList.add("on");
      core.classList.remove("blink");
      void core.offsetWidth;
      core.classList.add("blink");
      setTimeout(function () { core.classList.remove("blink"); }, 950);
      tone(880, 0.18, "sine", 0.04, 1.4);
      say("Secreto: doble toque. El núcleo parpadea.");
    }

    function secretRight() {
      noteActivity();
      tone(140, 0.22, "triangle", 0.04, 0.5);
      say("Secreto: clic derecho. Este gesto no suma energía.");
    }

    function secretHold() {
      noteActivity();
      holdFired = true;
      core.classList.remove("holding");
      core.classList.add("release");
      explode();
      noise(0.42, 0.18);
      tone(90, 0.5, "sine", 0.06, 0.35);
      say("Mantener 3 segundos: explosión.");
    }

    function secretWord() {
      noteActivity();
      document.body.classList.add("invert");
      tone(520, 0.16, "square", 0.02, 0.5);
      tone(390, 0.28, "sine", 0.03, 1.5);
      say("Modo inverso, 10 segundos. Lo activaste escribiendo nucleo.");
      clearTimeout(invertTimer);
      invertTimer = setTimeout(function () {
        document.body.classList.remove("invert");
      }, 10000);
    }

    function noteActivity() {
      var wasAsleep = document.body.classList.contains("asleep");
      if (wasAsleep) document.body.classList.remove("asleep");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        document.body.classList.add("asleep");
        applyPulse();
      }, 30000);
      if (wasAsleep) applyPulse();
    }

    function onPointerDown(e) {
      if (e.button !== 0) return;
      audio();
      noteActivity();
      holdFired = false;
      var c = center();
      drag = {
        x: e.clientX,
        y: e.clientY,
        ang: Math.atan2(e.clientY - c.y, e.clientX - c.x),
        moved: 0,
        t: performance.now(),
        charged: false
      };
      try { core.setPointerCapture(e.pointerId); } catch (err) {}
      core.classList.add("holding");
      clearTimeout(holdTimer);
      holdTimer = setTimeout(secretHold, 3000);
    }

    function onPointerUp(e) {
      if (e.button !== 0) return;
      clearTimeout(holdTimer);
      core.classList.remove("holding");
      var moved = drag ? drag.moved : 0;
      drag = null;
      if (holdFired) {
        holdFired = false;
        return;
      }
      if (moved > 22) return;
      swallow(targetMote);
      registerClick();
    }

    /* ========== Arranque ========== */
    function boot() {
      resize();
      seedAmbient();
      applyMood(moodFromHour());
      applyLevel();
      saveState();
      if (state.clicks === 0) hint.classList.add("show");
      noteActivity();
      try {
        if (moodName === "dawn" && !sessionStorage.getItem("el-nucleo-dawn")) {
          sessionStorage.setItem("el-nucleo-dawn", "1");
          setTimeout(function () {
            say("A esta hora el rojo no advierte: reconoce.");
          }, 1600);
        }
      } catch (err) { /* sin sessionStorage la madrugada solo cambia el color */ }
      requestAnimationFrame(frame);
    }

    core.addEventListener("pointerdown", onPointerDown);
    core.addEventListener("pointerup", onPointerUp);
    core.addEventListener("pointercancel", function () {
      clearTimeout(holdTimer);
      core.classList.remove("holding");
      drag = null;
    });
    core.addEventListener("dblclick", function (e) {
      e.preventDefault();
      secretDouble();
    });
    core.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        audio();
        registerClick();
      }
    });
    core.addEventListener("animationend", function (e) {
      if (e.animationName === "release" && e.target.classList.contains("pulse")) {
        core.classList.remove("release");
      }
      if (e.animationName === "gulp") core.classList.remove("gulp");
    });

    window.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      secretRight();
    });

    window.addEventListener("pointermove", function (e) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      if (drag && (e.buttons & 1)) {
        var c = center();
        var ang = Math.atan2(e.clientY - c.y, e.clientX - c.x);
        var delta = ang - drag.ang;
        if (delta > Math.PI) delta -= Math.PI * 2;
        if (delta < -Math.PI) delta += Math.PI * 2;
        drag.ang = ang;
        drag.moved += Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
        drag.x = e.clientX;
        drag.y = e.clientY;
        var deg = Math.min(42, Math.abs(delta) * 180 / Math.PI);
        if (deg > 0.35) {
          twist += delta < 0 ? -deg : deg;
          document.documentElement.style.setProperty("--twist", twist.toFixed(1) + "deg");
          addSpin(deg);
          if (drag.moved > 12) {
            clearTimeout(holdTimer);
            core.classList.remove("holding");
          }
        }
      }
      look();
      noteActivity();
    });

    window.addEventListener("keydown", function (e) {
      noteActivity();
      if (e.key && e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) {
        keyBuf = (keyBuf + e.key.toLowerCase()).slice(-6);
        if (keyBuf === "nucleo") {
          keyBuf = "";
          secretWord();
        }
      }
    });

    window.addEventListener("resize", resize);
    setInterval(function () {
      var next = moodFromHour();
      if (next !== moodName) applyMood(next);
    }, 60000);

    boot();
  </script>
</body>
</html>
