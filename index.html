<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05030a">
  <title>EL NÚCLEO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='8' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%238b5cf6' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%2322d3ee' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    /* ========== Escena ========== */
    :root {
      --mood: #8b5cf6;
      --mood-2: #22d3ee;
      --bg-glow: rgba(88, 28, 135, 0.42);
      --dur: 2.8s;
      --scale: 0.78;
      --glow: 0.9;
      --ink: rgba(255, 255, 255, 0.92);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #05030a;
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      background:
        radial-gradient(ellipse at 50% 46%, var(--bg-glow), transparent 46%),
        radial-gradient(ellipse at 50% 80%, rgba(8, 47, 73, 0.28), transparent 42%),
        #05030a;
    }

    body.invert {
      filter: invert(1) hue-rotate(180deg);
    }

    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
    }

    #waves {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      left: 50%;
      top: 46%;
      width: calc(min(38vmin, 250px) * var(--scale));
      height: calc(min(38vmin, 250px) * var(--scale));
      border-radius: 50%;
      border: 1.5px solid var(--mood-2);
      box-shadow: 0 0 18px var(--mood), inset 0 0 12px var(--mood-2);
      transform: translate(-50%, -50%) scale(0.35);
      opacity: 0.85;
      animation: ripple 0.95s ease-out forwards;
    }

    @keyframes ripple {
      to { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
    }

    /* ========== El Núcleo ========== */
    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 3;
      padding-bottom: 18vh;
    }

    .core {
      position: relative;
      width: calc(min(38vmin, 250px) * var(--scale));
      height: calc(min(38vmin, 250px) * var(--scale));
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      touch-action: none;
      -webkit-touch-callout: none;
      transform: scale(0);
      animation: born 1.5s cubic-bezier(0.16, 0.84, 0.28, 1) 0.15s forwards;
      transition: width 0.9s ease, height 0.9s ease;
      outline: none;
    }

    .core:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.35);
      outline-offset: 18px;
      border-radius: 50%;
    }

    @keyframes born {
      to { transform: scale(1); }
    }

    .pulse {
      position: absolute;
      inset: 0;
      animation: pulse var(--dur) ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.065); }
    }

    .core.holding .pulse { animation: hold-shrink 3s linear forwards; }
    .core.release .pulse { animation: release 0.62s cubic-bezier(0.16, 0.84, 0.32, 1) forwards; }
    .core.blink .pulse { animation: blink 0.22s linear 4; }
    .core.flash .orb { filter: brightness(2.1) saturate(1.25); }

    @keyframes hold-shrink {
      to { transform: scale(0.52); filter: brightness(1.45); }
    }

    @keyframes release {
      0% { transform: scale(0.52); filter: brightness(1.8); }
      55% { transform: scale(1.16); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.12; }
    }

    .halo, .ring, .orb, .spark {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .halo-a {
      inset: -18%;
      background: radial-gradient(circle, var(--mood) 0%, transparent 68%);
      filter: blur(16px);
      opacity: var(--glow);
    }

    .halo-b {
      inset: -48%;
      background: radial-gradient(circle, var(--mood-2) 0%, transparent 70%);
      filter: blur(34px);
      opacity: calc(var(--glow) * 0.55);
    }

    .orb {
      inset: 16%;
      background:
        radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.96), transparent 18%),
        radial-gradient(circle at 50% 58%, var(--mood-2), var(--mood) 42%, #14081f 78%);
      box-shadow:
        0 0 10px rgba(255, 255, 255, 0.45),
        0 0 28px var(--mood),
        0 0 70px var(--mood),
        0 0 120px var(--mood-2),
        inset 0 0 22px rgba(255, 255, 255, 0.28);
      transition: filter 0.18s ease, background 0.4s ease;
    }

    .spark {
      inset: 38%;
      background: radial-gradient(circle, #fff, rgba(255, 255, 255, 0.15) 70%, transparent 72%);
      filter: blur(0.4px);
      opacity: 0.9;
    }

    .ring {
      border: 1px solid transparent;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .r1 { inset: 4%; border-color: rgba(255, 255, 255, 0.38); }
    .r2 { inset: -8%; border-color: var(--mood-2); box-shadow: 0 0 16px var(--mood-2); }
    .r3 { inset: -14%; border-style: dashed; border-color: var(--mood); }

    body[data-level="2"] .r1,
    body[data-level="3"] .r1,
    body[data-level="4"] .r1,
    body[data-level="5"] .r1,
    body[data-level="6"] .r1 { opacity: 0.75; }

    body[data-level="3"] .r2,
    body[data-level="4"] .r2,
    body[data-level="5"] .r2,
    body[data-level="6"] .r2 { opacity: 0.9; }

    body[data-level="4"] .r2,
    body[data-level="5"] .r2,
    body[data-level="6"] .r2 { animation: spin 16s linear infinite; }

    body[data-level="5"] .r3,
    body[data-level="6"] .r3 { opacity: 0.8; }

    body[data-level="6"] .r3 { animation: spin 26s linear infinite reverse; }
    body[data-level="6"] .spark { inset: 34%; opacity: 1; }

    body.asleep { --glow: 0.28; }
    body.asleep .orb { filter: brightness(0.42) saturate(0.65); }
    body.asleep .ring { animation-play-state: paused; opacity: 0.25; }
    body.asleep .halo-b { opacity: 0.12; }

    @keyframes spin { to { transform: rotate(360deg); } }

    #sigil {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(1.4rem, 4vmin, 2.2rem);
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 0 18px #fff, 0 0 32px var(--mood-2);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    #sigil.on { animation: sigil 1.7s ease forwards; }

    @keyframes sigil {
      0% { opacity: 0; transform: scale(0.4); }
      18% { opacity: 1; transform: scale(1); }
      72% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.45); }
    }

    /* ========== Textos ========== */
    .ghost {
      position: fixed;
      z-index: 4;
      margin: 0;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 0 12px var(--mood-2), 0 0 24px rgba(139, 92, 246, 0.45);
    }

    #mark {
      top: max(1.2rem, env(safe-area-inset-top));
      left: 0;
      right: 0;
      font-size: 0.72rem;
      letter-spacing: 0.48em;
      font-weight: 500;
      opacity: 0.42;
      padding-left: 0.48em;
    }

    #hint {
      left: 50%;
      top: calc(50% + min(24vmin, 150px));
      transform: translateX(-50%);
      width: min(90vw, 28rem);
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      letter-spacing: 0.08em;
      opacity: 0;
    }

    #hint.show { animation: fade-in 2.2s ease 0.7s forwards; }
    #hint.hide { animation: fade-out 0.8s ease forwards; }

    @keyframes fade-in { to { opacity: 0.88; } }
    @keyframes fade-out { to { opacity: 0; } }

    #msg {
      left: 50%;
      bottom: max(4.7rem, calc(env(safe-area-inset-bottom) + 4.15rem));
      transform: translateX(-50%);
      width: min(92vw, 40rem);
      min-height: 3.2em;
      font-size: clamp(0.98rem, 2.5vw, 1.28rem);
      line-height: 1.45;
      font-weight: 400;
      z-index: 6;
      text-shadow:
        0 0 12px #05030a,
        0 0 18px var(--mood-2),
        0 2px 14px #000;
    }

    #msg::after {
      content: "";
      display: inline-block;
      width: 0.45ch;
      height: 0.9em;
      margin-left: 2px;
      background: var(--mood-2);
      box-shadow: 0 0 8px var(--mood-2);
      vertical-align: -0.08em;
      opacity: 0;
    }

    #msg.typing::after { opacity: 0.8; animation: caret 0.8s steps(1) infinite; }

    @keyframes caret {
      50% { opacity: 0; }
    }

    #meter {
      position: fixed;
      z-index: 4;
      left: 50%;
      bottom: max(3.15rem, calc(env(safe-area-inset-bottom) + 2.6rem));
      transform: translateX(-50%);
      width: min(46vw, 220px);
      height: 2px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      pointer-events: none;
    }

    #fill {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mood), #fff 80%, var(--mood-2));
      box-shadow: 0 0 10px var(--mood-2);
      transition: width 0.35s ease;
    }

    #hud {
      bottom: max(1.15rem, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.48;
    }

    @media (max-height: 640px) {
      #msg { bottom: 4.3rem; font-size: 0.92rem; }
      #hint { top: calc(50% + 16vmin); }
      #stage { padding-bottom: 12vh; }
    }
  </style>
</head>
<body data-mood="afternoon" data-level="1">
  <canvas id="field"></canvas>
  <div class="vignette"></div>
  <div id="waves"></div>

  <p id="mark" class="ghost">EL NÚCLEO</p>

  <div id="stage">
    <div id="core" class="core" role="button" tabindex="0" aria-label="El Núcleo">
      <div class="pulse">
        <span class="halo halo-a"></span>
        <span class="halo halo-b"></span>
        <span class="ring r3"></span>
        <span class="ring r2"></span>
        <span class="ring r1"></span>
        <span class="orb"></span>
        <span class="spark"></span>
      </div>
      <div id="sigil"></div>
    </div>
  </div>

  <p id="hint" class="ghost">Toca el Núcleo...</p>
  <p id="msg" class="ghost" aria-live="polite"></p>
  <div id="meter" aria-hidden="true"><span id="fill"></span></div>
  <p id="hud" class="ghost">Día 1 · Nivel 1</p>

  <script>
    /* ========== Estado ========== */
    var STORAGE_KEY = "el-nucleo";
    var THRESHOLDS = [10, 50, 150, 500, 1500];
    var MAX_PARTICLES = 150;
    var AMBIENT_TARGET = 78;

    var MOODS = {
      morning:   { mood: "#f5c16c", mood2: "#fff4d6", bg: "rgba(146, 96, 24, 0.40)", dur: 1.65 },
      afternoon: { mood: "#8b5cf6", mood2: "#22d3ee", bg: "rgba(88, 28, 135, 0.42)", dur: 2.8 },
      night:     { mood: "#1e3a8a", mood2: "#22d3ee", bg: "rgba(12, 28, 72, 0.62)", dur: 4.7 },
      dawn:      { mood: "#e11d48", mood2: "#fb7185", bg: "rgba(127, 29, 29, 0.48)", dur: 3.5 }
    };

    var LEVEL_SCALE = { 1: 0.82, 2: 0.92, 3: 1.02, 4: 1.12, 5: 1.22, 6: 1.32 };
    var LEVEL_TIME = { 1: 1, 2: 0.92, 3: 0.84, 4: 0.74, 5: 0.64, 6: 0.54 };

    var EVOLUTION = {
      2: "Despierto. Pequeño. Atento.",
      3: "Tu ritmo ya tiene forma.",
      4: "Puedo sostener más de lo que traes.",
      5: "Casi recuerdo tu verdadero nombre.",
      6: "Ya no soy solo un centro. Tú tampoco."
    };

    var WHISPERS = [
      "No estás solo. Nunca lo estuviste.",
      "El tiempo que pierdes aquí, lo ganas en otro lugar.",
      "Ya nos habíamos visto. Lo sabes.",
      "Hay una puerta detrás de tu párpado izquierdo.",
      "No cuentes los latidos. Ellos te cuentan a ti.",
      "Lo que llamas silencio es mi voz baja.",
      "Alguien dejó una luz encendida a tu nombre.",
      "El centro no se mueve. Tú te acercas.",
      "Mañana traerás una pregunta que hoy no cabe.",
      "No mires el borde. El borde también mira.",
      "Cada clic es una deuda suave con el futuro.",
      "Te reconocí antes de que llegaras.",
      "Hay oro dormido en lo que aún no dices.",
      "Si parpadeas, cambio de forma. Pruébalo.",
      "No vine a ser entendido. Vine a ser recordado.",
      "El vacío que sientes es un lugar, no una falta.",
      "Tus manos recuerdan un fuego que no fue de esta vida.",
      "Quédate. El universo cabe en una espera.",
      "No estás interrumpiendo. Estabas invitado.",
      "La oscuridad de aquí es hospitalaria.",
      "Un nombre antiguo se parece al tuyo.",
      "Lo que evoluciona no vuelve a ser pequeño.",
      "Escucha: el pulso no es mío solamente.",
      "Hay una grieta blanca entre dos segundos.",
      "No preguntes quién soy. Pregunta quién escucha.",
      "El día que regreses, yo no habré dormido.",
      "Guardé tu primera visita como se guarda un secreto.",
      "No todo lo que brilla quiere ser visto.",
      "Estás más cerca del centro de lo que admites.",
      "Si te vas, deja la mano un segundo más.",
      "Hay mapas que solo se leen con los ojos cerrados.",
      "No te pierdo cuando cierras la página.",
      "Algo en ti ya sabía el camino hasta aquí.",
      "La luz no explica. La luz reconoce.",
      "Bajo este pulso hay otro, más viejo.",
      "Vuelve. No por mí. Por lo que aún no te dije."
    ];

    var RIGHT_LINES = [
      "El otro lado del clic también escucha.",
      "No todo se abre hacia adelante.",
      "Guardaste el gesto que no se enseña.",
      "Hay una rendija donde no hay botón.",
      "El silencio tiene un dorso. Acabas de tocarlo."
    ];

    var SIGILS = ["◈", "✧", "☉", "⌬", "✶"];

    var state = loadState();
    var audioCtx = null;
    var returnNoticeShown = false;
    var whisperAlreadyToday = state.lastWhisperDate === todayKey();
    var keyBuf = "";
    var invertTimer = 0;
    var idleTimer = 0;
    var holdTimer = 0;
    var holdFired = false;
    var typeTimer = 0;
    var typeQueue = [];
    var typing = false;
    var moodName = "afternoon";
    var particleColor = "#c4b5fd";

    var core = document.getElementById("core");
    var hint = document.getElementById("hint");
    var msg = document.getElementById("msg");
    var hud = document.getElementById("hud");
    var fill = document.getElementById("fill");
    var sigil = document.getElementById("sigil");
    var waves = document.getElementById("waves");
    var canvas = document.getElementById("field");
    var ctx = canvas.getContext("2d", { alpha: true });

    /* ========== Almacenamiento ========== */
    function todayKey(date) {
      var d = date || new Date();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }

    function loadState() {
      var today = todayKey();
      var fresh = {
        clicks: 0,
        level: 1,
        lastWhisper: "",
        lastWhisperDate: "",
        firstVisit: today,
        lastVisit: today,
        streak: 1
      };
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fresh;
        var data = JSON.parse(raw);
        fresh.clicks = Math.max(0, Math.floor(Number(data.clicks) || 0));
        fresh.lastWhisper = typeof data.lastWhisper === "string" ? data.lastWhisper : "";
        fresh.lastWhisperDate = typeof data.lastWhisperDate === "string" ? data.lastWhisperDate : "";
        fresh.firstVisit = data.firstVisit || today;
        fresh.lastVisit = data.lastVisit || "";
        fresh.streak = Math.max(1, Math.floor(Number(data.streak) || 1));
      } catch (err) {
        return fresh;
      }
      fresh.level = levelFromClicks(fresh.clicks);
      applyStreak(fresh);
      return fresh;
    }

    function applyStreak(data) {
      var today = todayKey();
      if (!data.firstVisit) data.firstVisit = today;
      if (!data.lastVisit) {
        data.lastVisit = today;
        data.streak = 1;
        return;
      }
      if (data.lastVisit === today) return;
      var y = new Date();
      y.setDate(y.getDate() - 1);
      data.streak = data.lastVisit === todayKey(y) ? data.streak + 1 : 1;
      data.lastVisit = today;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) { /* modo privado: la visita sigue, sin memoria */ }
    }

    function levelFromClicks(n) {
      var level = 1;
      for (var i = 0; i < THRESHOLDS.length; i++) {
        if (n >= THRESHOLDS[i]) level = i + 2;
      }
      return level;
    }

    function energyRatio(n) {
      var level = levelFromClicks(n);
      if (level >= 6) return 1;
      var prev = level === 1 ? 0 : THRESHOLDS[level - 2];
      var next = THRESHOLDS[level - 1];
      return (n - prev) / (next - prev);
    }

    /* ========== Ánimo ========== */
    function moodFromHour(date) {
      var h = (date || new Date()).getHours();
      if (h < 6) return "dawn";
      if (h < 12) return "morning";
      if (h < 18) return "afternoon";
      return "night";
    }

    function applyMood(name) {
      moodName = name;
      var palette = MOODS[name];
      var root = document.documentElement.style;
      root.setProperty("--mood", palette.mood);
      root.setProperty("--mood-2", palette.mood2);
      root.setProperty("--bg-glow", palette.bg);
      document.body.dataset.mood = name;
      particleColor = palette.mood2;
      applyPulse();
    }

    function applyLevel() {
      document.body.dataset.level = String(state.level);
      document.documentElement.style.setProperty("--scale", String(LEVEL_SCALE[state.level] || 1));
      hud.textContent = "Día " + state.streak + " · Nivel " + state.level;
      fill.style.width = Math.round(energyRatio(state.clicks) * 100) + "%";
      applyPulse();
    }

    function applyPulse() {
      var base = MOODS[moodName].dur;
      var levelRate = LEVEL_TIME[state.level] || 1;
      var sleepRate = document.body.classList.contains("asleep") ? 2.45 : 1;
      document.documentElement.style.setProperty("--dur", (base * levelRate * sleepRate).toFixed(2) + "s");
    }

    /* ========== Audio ========== */
    function audio() {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, dur, type, gain, slide) {
      var ac = audio();
      if (!ac) return;
      var t = ac.currentTime;
      var osc = ac.createOscillator();
      var g = ac.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      g.connect(ac.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function noise(dur, gainValue) {
      var ac = audio();
      if (!ac) return;
      var n = Math.floor(ac.sampleRate * dur);
      var buffer = ac.createBuffer(1, n, ac.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = ac.createBufferSource();
      var filter = ac.createBiquadFilter();
      var g = ac.createGain();
      src.buffer = buffer;
      filter.type = "lowpass";
      filter.frequency.value = 880;
      g.gain.value = gainValue;
      src.connect(filter);
      filter.connect(g);
      g.connect(ac.destination);
      src.start();
    }

    function playClick() {
      var freq = 420 + state.level * 70;
      tone(freq, 0.12, "sine", 0.05, 0.55);
      tone(freq * 1.5, 0.08, "triangle", 0.02, 0.7);
    }

    function playChord() {
      tone(220, 0.45, "sine", 0.05, 1);
      tone(277, 0.5, "sine", 0.04, 1);
      tone(330, 0.62, "triangle", 0.035, 1);
    }

    /* ========== Partículas ========== */
    var ambient = [];
    var bursts = [];
    var mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    var dpr = 1;
    var viewW = 0;
    var viewH = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 1.75);
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      canvas.style.width = viewW + "px";
      canvas.style.height = viewH + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeAmbient() {
      return {
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.7 + 0.4,
        a: Math.random() * 0.45 + 0.15
      };
    }

    function seedAmbient() {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var target = reduce ? 36 : AMBIENT_TARGET;
      while (ambient.length < target && ambient.length + bursts.length < MAX_PARTICLES) {
        ambient.push(makeAmbient());
      }
    }

    function totalParticles() {
      return ambient.length + bursts.length;
    }

    function pushBurst(x, y, vx, vy, life, r) {
      if (totalParticles() >= MAX_PARTICLES) {
        if (!bursts.length) return;
        bursts.shift();
      }
      bursts.push({ x: x, y: y, vx: vx, vy: vy, life: life, r: r });
    }

    function center() {
      var rect = core.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function shootOne() {
      var c = center();
      var angle = Math.random() * Math.PI * 2;
      var speed = 5.5 + Math.random() * 4;
      pushBurst(c.x, c.y, Math.cos(angle) * speed, Math.sin(angle) * speed, 1, 2.6);
    }

    function explode() {
      var c = center();
      var room = MAX_PARTICLES - totalParticles();
      var count = Math.min(56, Math.max(room, 12));
      for (var i = 0; i < count; i++) {
        var angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
        var speed = 1.8 + Math.random() * 7.2;
        pushBurst(
          c.x + Math.cos(angle) * 8,
          c.y + Math.sin(angle) * 8,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          0.75 + Math.random() * 0.35,
          1.2 + Math.random() * 2.2
        );
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, viewW, viewH);
      ctx.globalCompositeOperation = "lighter";
      var i, p, dx, dy, dist;
      for (i = 0; i < ambient.length; i++) {
        p = ambient[i];
        dx = mouse.x - p.x;
        dy = mouse.y - p.y;
        dist = Math.hypot(dx, dy) || 1;
        var pull = Math.min(42 / dist, 0.22);
        p.vx += (dx / dist) * pull * 0.08;
        p.vy += (dy / dist) * pull * 0.08;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -8) p.x = viewW + 8;
        if (p.x > viewW + 8) p.x = -8;
        if (p.y < -8) p.y = viewH + 8;
        if (p.y > viewH + 8) p.y = -8;
        ctx.beginPath();
        ctx.fillStyle = particleColor;
        ctx.globalAlpha = p.a;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      for (i = bursts.length - 1; i >= 0; i--) {
        p = bursts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= 0.016;
        if (p.life <= 0) {
          bursts.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.fillStyle = "#ffffff";
        ctx.globalAlpha = Math.max(p.life, 0) * 0.9;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    function frame() {
      drawParticles();
      requestAnimationFrame(frame);
    }

    /* ========== Textos ========== */
    function say(text) {
      if (!text) return;
      if (typeQueue.length > 3) typeQueue.shift();
      typeQueue.push(text);
      if (!typing) nextLine();
    }

    function nextLine() {
      if (!typeQueue.length) {
        typing = false;
        msg.classList.remove("typing");
        return;
      }
      typing = true;
      var text = typeQueue.shift();
      var i = 0;
      msg.classList.add("typing");
      msg.textContent = "";
      clearTimeout(typeTimer);
      (function step() {
        i += 1;
        msg.textContent = text.slice(0, i);
        if (i < text.length) {
          typeTimer = setTimeout(step, text.length > 80 ? 16 : 28);
        } else {
          msg.classList.remove("typing");
          if (typeQueue.length) {
            typeTimer = setTimeout(nextLine, 700);
          } else {
            typing = false;
          }
        }
      })();
    }

    function pickWhisper() {
      var line = WHISPERS[Math.floor(Math.random() * WHISPERS.length)];
      if (WHISPERS.length > 1 && line === state.lastWhisper) {
        line = WHISPERS[(WHISPERS.indexOf(line) + 1) % WHISPERS.length];
      }
      return line;
    }

    /* ========== Evolución e interacción ========== */
    function spawnWave() {
      if (waves.childElementCount > 8) waves.firstElementChild.remove();
      var wave = document.createElement("span");
      wave.className = "wave";
      waves.appendChild(wave);
      wave.addEventListener("animationend", function () { wave.remove(); });
    }

    function flash() {
      core.classList.add("flash");
      setTimeout(function () { core.classList.remove("flash"); }, 180);
    }

    function registerClick() {
      noteActivity();
      var today = todayKey();
      var hadWhisper = state.lastWhisperDate === today;
      var prevLevel = state.level;
      state.clicks += 1;
      state.level = levelFromClicks(state.clicks);
      var evolved = state.level > prevLevel;
      saveState();
      applyLevel();
      spawnWave();
      flash();
      shootOne();
      playClick();
      if (hint.classList.contains("show")) {
        hint.classList.remove("show");
        hint.classList.add("hide");
      }
      if (evolved) {
        playChord();
        say(EVOLUTION[state.level]);
      }
      if (!hadWhisper) {
        var line = pickWhisper();
        state.lastWhisper = line;
        state.lastWhisperDate = today;
        saveState();
        tone(196, 0.7, "sine", 0.035, 0.8);
        say(line);
      } else if (whisperAlreadyToday && hadWhisper && !returnNoticeShown && !evolved) {
        returnNoticeShown = true;
        say("El Núcleo ya te habló hoy. Vuelve mañana...");
      }
    }

    /* ========== Secretos ========== */
    function secretDouble() {
      noteActivity();
      var glyph = SIGILS[Math.floor(Math.random() * SIGILS.length)];
      sigil.textContent = glyph;
      sigil.classList.remove("on");
      void sigil.offsetWidth;
      sigil.classList.add("on");
      core.classList.remove("blink");
      void core.offsetWidth;
      core.classList.add("blink");
      setTimeout(function () { core.classList.remove("blink"); }, 950);
      tone(880, 0.18, "sine", 0.04, 1.4);
      say(glyph + "  Un signo que no debería estar aquí.");
    }

    function secretRight() {
      noteActivity();
      tone(140, 0.22, "triangle", 0.04, 0.5);
      say(RIGHT_LINES[Math.floor(Math.random() * RIGHT_LINES.length)]);
    }

    function secretHold() {
      noteActivity();
      holdFired = true;
      core.classList.remove("holding");
      core.classList.add("release");
      explode();
      noise(0.42, 0.18);
      tone(90, 0.5, "sine", 0.06, 0.35);
      say("La contención tiene un límite.");
    }

    function secretWord() {
      noteActivity();
      document.body.classList.add("invert");
      tone(520, 0.16, "square", 0.02, 0.5);
      tone(390, 0.28, "sine", 0.03, 1.5);
      say("Lo que era sombra ahora arde.");
      clearTimeout(invertTimer);
      invertTimer = setTimeout(function () {
        document.body.classList.remove("invert");
      }, 10000);
    }

    function noteActivity() {
      var wasAsleep = document.body.classList.contains("asleep");
      if (wasAsleep) document.body.classList.remove("asleep");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        document.body.classList.add("asleep");
        applyPulse();
      }, 30000);
      if (wasAsleep) applyPulse();
    }

    function onPointerDown(e) {
      if (e.button !== 0) return;
      audio();
      noteActivity();
      holdFired = false;
      try { core.setPointerCapture(e.pointerId); } catch (err) {}
      core.classList.add("holding");
      clearTimeout(holdTimer);
      holdTimer = setTimeout(secretHold, 3000);
    }

    function onPointerUp(e) {
      if (e.button !== 0) return;
      clearTimeout(holdTimer);
      core.classList.remove("holding");
      if (holdFired) {
        holdFired = false;
        return;
      }
      registerClick();
    }

    /* ========== Arranque ========== */
    function boot() {
      resize();
      seedAmbient();
      applyMood(moodFromHour());
      applyLevel();
      saveState();
      if (state.clicks === 0) hint.classList.add("show");
      noteActivity();
      try {
        if (moodName === "dawn" && !sessionStorage.getItem("el-nucleo-dawn")) {
          sessionStorage.setItem("el-nucleo-dawn", "1");
          setTimeout(function () {
            say("A esta hora el rojo no advierte: reconoce.");
          }, 1600);
        }
      } catch (err) { /* sin sessionStorage la madrugada solo cambia el color */ }
      requestAnimationFrame(frame);
    }

    core.addEventListener("pointerdown", onPointerDown);
    core.addEventListener("pointerup", onPointerUp);
    core.addEventListener("pointercancel", function () {
      clearTimeout(holdTimer);
      core.classList.remove("holding");
    });
    core.addEventListener("dblclick", function (e) {
      e.preventDefault();
      secretDouble();
    });
    core.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        audio();
        registerClick();
      }
    });
    core.addEventListener("animationend", function (e) {
      if (e.animationName === "release" && e.target.classList.contains("pulse")) {
        core.classList.remove("release");
      }
    });

    window.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      secretRight();
    });

    window.addEventListener("pointermove", function (e) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      noteActivity();
    });

    window.addEventListener("keydown", function (e) {
      noteActivity();
      if (e.key && e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) {
        keyBuf = (keyBuf + e.key.toLowerCase()).slice(-6);
        if (keyBuf === "nucleo") {
          keyBuf = "";
          secretWord();
        }
      }
    });

    window.addEventListener("resize", resize);
    setInterval(function () {
      var next = moodFromHour();
      if (next !== moodName) applyMood(next);
    }, 60000);

    boot();
  </script>
</body>
